<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuste de Inventario por Merma o Daño</title>
    <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Inventario: Ajuste por Merma o Daño</h1>
        <p>Como gerente, registra aquí los productos defectuosos o caducados para descontar el stock y registrar la pérdida.</p>

        <!-- Formulario de Ajuste -->
        <div class="card-formulario" style="margin: 20px 0; padding: 20px; background: #f4f4f4; border-radius: 8px; max-width: 500px;">
            <form id="formMerma" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="idProducto"><strong>ID del Producto:</strong></label><br>
                    <input type="number" id="idProducto" name="idProducto" placeholder="Ej. 1" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div>
                    <label for="cantidadAjustar"><strong>Cantidad a Descontar:</strong></label><br>
                    <input type="number" id="cantidadAjustar" name="cantidadAjustar" placeholder="Ej. 2" min="1" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div>
                    <label for="causa"><strong>Causa del Ajuste:</strong></label><br>
                    <select id="causa" name="causa" required style="width: 100%; padding: 8px; margin-top: 5px;">
                        <option value="">Seleccione una causa...</option>
                        <option value="Caducado">Caducado</option>
                        <option value="Dañado / Roto">Dañado / Roto</option>
                        <option value="Defectuoso de fábrica">Defectuoso de fábrica</option>
                        <option value="Merma por manejo">Merma por manejo</option>
                    </select>

                    <label for="gerente">Nombre del Gerente:</label>
                    <input type="text" id="gerente" value="gerente" required>
                </div>
                <div>
                    <button type="submit" style="padding: 10px 20px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Aplicar Ajuste de Merma</button>
                </div>
            </form>
        </div>

        <div style="margin-top: 20px;">
            <a href="../index.html" class="btn-regresar">Regresar al Inicio</a>
        </div>
    </div>

    <script>
        document.getElementById("formMerma").addEventListener("submit", async (e) => {
            e.preventDefault();

            const datos = {
                idProducto: document.getElementById("idProducto").value,
                cantidadAjustar: document.getElementById("cantidadAjustar").value,
                causa: document.getElementById("causa").value,
                gerente: document.getElementById("gerente").value
            };

            try {
                
                const respuesta = await fetch("/api/productos/merma", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (resultado.ok) {
                    alert("¡Éxito! " + resultado.mensaje);
                    document.getElementById("formMerma").reset();
                } else {
                    alert("Error: " + resultado.mensaje);
                }
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
                alert("Error de conexión con el servidor.");
            }
        });
    </script>
</body>
</html>
