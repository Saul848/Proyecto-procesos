<!-- Submenú / Modal para Nueva Categoría (Inicialmente oculto) -->
<div id="modal-categoria" class="modal">
    <div class="modal-contenido">
        <h2>Agregar Nueva Categoría</h2>

        <div class="grupo-campos" id="campos-producto">
            <div class="campo" id="campo-nueva-categoria">
                <label for="input-nombre-nueva-categoria">Nombre de la categoría:</label>
                <input type="text" id="input-nombre-nueva-categoria" placeholder="Ej. Lácteos, Limpieza...">
            </div>
        </div>

        <div class="contenedor-botones" id="botones-categoria-agregar">
            <button id="boton-salir-agregar-categoria">Cerrar</button>
            <button id="boton-agregar-categoria">Agregar</button>
        </div>
    </div>
</div>


</div>
