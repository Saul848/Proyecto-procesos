<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/empleado.css">
    <title>OXXO - Empleado</title>
    <link rel="stylesheet" href="../css/venta.css">
</head>
<body>

    
    <header class="barra-sesion">
        <div>
            <strong>OXXO</strong> | <span>Hola, <span id="saludo-nombre">Empleado</span></span>
            <label id="msgPestaña">Menu empleado</label>
            <button id="btnMensajes"> Mensajes </button>
            <button id="btn-logout"> Salir</button>
        </div>

    <div>
        <div>
            <button id="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</button>
        </div>
    </header>

    <div class="main-container" style="margin-top: 15px;">

        
        <header class="header">
            <h1><i class="fa-solid fa-cash-register"></i> Punto de Venta</h1>
            <div class="caja-status">
                <span id="cajaDot" class="status-dot"></span>
                <span id="cajaTexto">Caja Abierta</span>
                <button id="btnToggleCaja" class="btn-toggle-caja">Cerrar Caja</button>
            </div>
        </header>

        
        <main class="content-grid">

            
            <section class="products-panel">
                <div class="search-header-bar">
                    <div class="search-input-wrapper">
                        <input type="text" id="inputBuscar" placeholder="Buscar producto">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <span class="label-id-filter">ID producto</span>
                </div>

                <div class="table-wrapper">
                    <table class="table-pos">
                        <thead>
                            <tr>
                                <th>Select</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>cantidad</th>
                                <th>ID</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosCuerpo">
                            
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Ticket de cuenta -->
            <section class="ticket-panel">
                <div class="ticket-header" id="lblFolioVenta">
                    Venta numero 1
                </div>

                <div id="listaItemsTicket" class="ticket-items-list">
                    <p style="text-align: center; color: #888; font-size: 13px; margin-top: 30px;">
                        No hay productos en la cuenta
                    </p>
                </div>

                <div class="ticket-totals">
                    <div class="row">
                        <span>subtotal</span>
                        <span id="lblSubtotal">$0</span>
                    </div>
                    <div class="row">
                        <span>IVA</span>
                        <span id="lblIva">$0</span>
                    </div>
                    <div class="row row-total">
                        <span>Total</span>
                        <span id="lblTotal">$0</span>
                    </div>
                </div>

                <div class="payment-area">
                    <div class="methods-row">
                        <button type="button" id="btnEfectivo" class="btn-method active">Efectivo</button>
                        <button type="button" id="btnTarjeta" class="btn-method">Tarjeta</button>
                    </div>

                    <div class="inputs-group">
                        <div class="input-row">
                            <label for="inputMontoRecibido">Monto recibido</label>
                            <input type="number" id="inputMontoRecibido" placeholder="0.00" min="0" step="any">
                        </div>
                        <div class="input-row">
                            <label for="inputCambio">Cambio</label>
                            <input type="text" id="inputCambio" value="$0.00" readonly>
                        </div>
                    </div>

                    <div class="actions-row">
                        <button id="btnRegistrarPago" class="btn-registrar" disabled>Registrar pago</button>
                        <button type="button" class="btn-factura">Factura</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Ticket -->
    <div id="modalTicket" class="modal">
        <div class="modal-content">
            <h3>Comprobante</h3>
            <div id="reciboDetalle" class="receipt-body"></div>
            <button id="btnCerrarModal" class="btn-registrar" style="width: 100%; margin-top: 10px;">Aceptar</button>
        </div>
    </div>

    
    <div id="checkMensajes" class="modal-overlay" style="display: none;">
        <div class="modal-caja">
            <h3>Mensajes pendientes:</h3>
            <div id="contenedorDetalles">

            </div>
            <div id="contenedorBoton">
                <button id="btnCerrarModal">Cerrar</button>
            </div>
        </div>
    </div>
      
      <script src="../js/empleado.js"></script>
    <script src="../js/cerrarSesion.js"></script>
    <script src="../js/venta.js"></script>
</body>
</html>
