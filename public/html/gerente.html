<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxxo - Gerente</title>
    <link rel="stylesheet" href="../css/gerente.css">
    <link rel="stylesheet" href="../css/barra_sesion.css">
</head>
<body>
    
    <header class="barra-sesion-gerente">
        <div>
            <strong>OXXO</strong> | <span>Hola, <span id="saludo-nombre">Gerente</span></span>
        </div>

    <div>
        <div>
            <button id="btnMensajes"> Mensajes </button>
            <button id="btn-logout"> Cerrar sesión </button>
        </div>
    </div>
    </header>

    <section class = "contenido">
        <section class = "datos">
            <section class = "perfil">
                <div id="divDatosPerfil">
                    <div id="divNumEmp">
                        <label id="numEmp">Empleado #?</label>
                    </div>
                    <div id="divDatosEmp">
                        <div id="divDesgloce">
                            <label id="nombreEmp">Nombre empleado</label>
                            <label id="puestoEmp">Puesto</label>
                            <label id="infoContacto">Info de contacto</label>    
                        </div>
                        <div id="divImagenEmp"> 
                            <img id="imgEmpleado" src="" alt=""> <Label>IMAGEN </Label>
                        </div>
                    </div>
                </div>    
            </section>
            <section class = "formulario">
                <div id="opcciones">
                    <button id="btnAgregarEmpleado">Agregar empleado</button>
                    <button id="btnModificarEmpleado">Modificar empleado</button>
                </div> 
                <div id="seccionAgregar">
                    <div id="divMsgAgregarEmp">
                        <div class="espacioBtnRegresar"><button class="btnRegresar">Regresar</button></div>
                        <label id="msgAgregarEmp">Agregar empleado</label>
                    </div>
                    <div class="lineaInp">
                        <label for="inpNombre">Nombre:</label><input type="text" id="inpNombre" placeholder="Escribe el nombre del empleado" />
                    </div>
                    <div class="lineaInp">
                        <label for="selectPuesto">Puesto:</label>
                        <select id="selectPuesto">
                            <option value="empleado">Empleado</option>
                            <option value="administrador">Administrador</option>
                            <option value="gerente">Gerente</option>
                        </select>
                    </div>
                    <div class="lineaInp">
                        <label for="inpTel">Telefono:</label> <input type="text" id="inpTel" placeholder="Escribe el telefono del empleado" />
                    </div> 
                    <div class="lineaInp">
                        <label for="inpUsuario">Usuario:</label><input type="text" id="inpUsuario" placeholder="Escribe el usuario del empleado" />
                    </div>
                    <div class="lineaInp">
                        <label for="inpPassword">Contraseña:</label> <input type="text" id="inpPassword" placeholder="Escribe la contraseña del empleado empleado" />
                    </div>
                    <div id="divBtnGuardarDatos">
                        <button id="btnGuardarDatos">Guardar Datos</button>
                    </div>
                </div>

                <div id="seccionModificar">
                    <div id="divMsgModificarEmp">
                        <div class="espacioBtnRegresar"><button class="btnRegresar">Regresar</button></div>
                        <label id="msgModificarEmp">Modificar empleado</label>
                    </div>
                    <div class="lineaInp">
                        <label for="inpNombreAct">Nombre actual:</label> <input type="text" id="inpNombreAct"/>
                        <label for="inpNuevoNombre">Nuevo nombre: </label> <input type="text" id="inpNuevoNombre" placeholder="Escribe el nombre del empleado" />   
                    </div>
                    <div class="lineaInp">
                        <label for="inpPuestoAct">Puesto actual:</label> <input type="text" id="inpPuestoAct" />
                        <label for="selectNuevoPuesto">Nuevo puesto:</label>
                        <select id="selectNuevoPuesto">
                            <option value="empleado">Empleado</option>
                            <option value="administrador">Administrador</option>
                            <option value="gerente">Gerente</option>
                        </select>
                    </div>
                    <div class="lineaInp">
                        <label for="inpTelefonoAct">Telefono actual:</label> <input type="text" id="inpTelefonoAct"/>
                        <label for="inpNuevoTelefono">Nuevo telefono:</label> <input type="text" id="inpNuevoTelefono" placeholder="Escribe el telefono del empleado" />
                    </div>
                    <div class="lineaInp">
                        <label for="inpUsuarioAct">Usuario actual:</label> <input type="text" id="inpUsuarioAct" />
                        <label for="inpNuevoUsuario">Nuevo usuario:</label> <input type="text" id="inpNuevoUsuario" placeholder="Escribe el usuario del empleado" />
                    </div>
                    <div class="lineaInp">
                        <label for="inpPasswordAct">Contraseña actual:</label> <input type="text" id="inpPasswordAct"/>
                        <label for="inpNuevoPassword">Nueva contraseña:</label> <input type="text" id="inpNuevoPassword" placeholder="Escribe la contraseña del empleado"/>   
                    </div>
                    <div id="divBtnActualizarDatos">
                        <button id="btnActualizarDatos">Actualizar datos</button>
                    </div>
                </div>
            </section>
        </section>
        <section class="contLista">
            <aside class="listaAct">
                <div id="seccionEmp">
                </div>
            </aside>
            <div id="divBtnGenReporte">
                <button id="btnGenReporte">Generar reporte</button>
            </div>
        </section>
    </section>

    <div id="formMensaje" class="modal-overlay" style="display: none;">
        <div class="modal-caja">
            <h3>Nuevo mensaje</h3>
            <label>Destinatario</label>
            <input id="inputDestinatario"></input>

            <label>Contenido</label>
            <textarea id="inputContenido"></textarea>

            <button id="btnEnviarMensaje">Enviar</button>
            <button id="btnCerrarModal">Cancelar</button>
        </div>
    </div>
</body>
</html>
<script src="../js/gerente.js" defer></script>
<script src="../js/cerrar_sesion.js"></script>
<script src="../js/empleado.js"></script>
