<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Administrador/Productos</title>
  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="../css/panelAdministradorProductos.css">
  <link rel="stylesheet" href="../css/modal_agregar_producto.css">
  <link rel="stylesheet" href="../css/modal_agregar_categoria.css">

  <div id="contenedor-modal"></div>

  <script type="module" src="../js/panelAdministradorProductos.js"></script>
  <script type="module" src="../js/modal_agregar_producto.js"></script>
  <script type="module" src="../js/modal_agregar_categoria.js"></script>

</head>

<body>

  <div class="main-container">
    <!-- Encabezado -->
    <header class="header">
      <h1>Menu Administrador/Productos</h1>
    </header>

    <!-- Contenido Principal -->
    <div class="content-grid">

      <!-- Columna Izquierda: Búsqueda y Lista -->
      <section class="left-section">

        <div class="search-bar">
          <h2>Buscar producto</h2>
          <input type="text" id="id_busqueda" placeholder="Ingresar nombre o id">
          <button class="btn-primary">Buscar</button>
          <div class="campo" id="campo-categoria">
            <select id="selec-categoria-producto" name="categoriaProducto">
            </select>
          </div>
          <button class="btn-primary" id="btn-registrar-categoria">+</button>
        </div>

        <!-- Aqui se muestran los productos -->
        <div class="product-list">
        </div>
      </section>

      <!-- Columna Derecha: Información y Registro -->
      <section class="right-section">
        <div class="info-box">
          <h2>Informacion producto</h2>
        </div>

        <div class="register-box">
          <h2>Registrar un nuevo producto</h2>
          <button class="btn-primary" id="boton-registrar-producto">Registrar nuevo</button>
        </div>
      </section>

    </div>
  </div>

  <div id="contenedor-modal"></div>

</body>

</html>
