<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Desempeño de Empleados</title>
    <link rel="stylesheet" href="../css/catalogo.css"> 
</head>
<body>
    <div class="container">
        <h1>Reporte de Desempeño y Promociones</h1>
        
        <div class="card-resumen" style="margin: 20px 0; padding: 15px; background: #f4f4f4; border-radius: 8px;">
            <h3>Empleados Evaluados: <span id="totalEmpleados">0</span></h3>
        </div>

        <table class="tabla-productos" border="1" width="100%" style="border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Puesto</th>
                    <th>Ventas</th>
                    <th>Transacciones</th>
                    <th>Estatus / Promoción</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaDesempeno">
                
            </tbody>
        </table>

        <div style="margin-top: 20px;">
            <a href="gerente.html" class="btn-regresar">Regresar al Inicio</a>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarReporteDesempeno();
        });

        async function cargarReporteDesempeno() {
            try {
                const respuesta = await fetch("/api/empleados/reporte-desempeno");
                const datos = await respuesta.json();

                if (datos.ok) {
                    document.getElementById("totalEmpleados").textContent = datos.empleados.length;
                    const cuerpoTabla = document.getElementById("cuerpoTablaDesempeno");
                    cuerpoTabla.innerHTML = "";

                    datos.empleados.forEach(emp => {
                        const fila = document.createElement("tr");

                        // Guardamos las dos condiciones en constantes para mayor claridad
                        const esCandidato = emp.esCandidatoPromocion;
                        const esMvp = String(datos.mvp) === String(emp.id);

                        // Evaluamos los casos de color de fondo para la fila
                        if (esCandidato && esMvp) {
                            // CASO: Se cumplen LAS DOS condiciones al mismo tiempo -> Amarillo
                            fila.style.backgroundColor = "#fff9c4"; // Amarillo suave (puedes usar "yellow" si prefieres un tono fuerte)
                        } else if (esCandidato) {
                            // CASO: Solo es candidato a promoción -> Verde claro
                            fila.style.backgroundColor = "#e8f8f5"; 
                        } else if (esMvp) {
                            // CASO: Solo es empleado del mes -> (Opcional, puedes dejarlo sin color o poner otro)
                            fila.style.backgroundColor = "#fff3e0"; 
                        }

                        fila.innerHTML = `
                            <td>${emp.id}</td>
                            <td>${emp.nombre}</td>
                            <td>${emp.puesto}</td>
                            <td>${emp.numVentas}</td>
                            <td>${emp.numTransacciones}</td>
                            <td>
                                ${esCandidato 
                                    ? '<span style="color: green; font-weight: bold;">⭐ Candidato a Promoción</span>' 
                                    : '<span style="color: gray;">En seguimiento</span>'}

                                ${esMvp 
                                    ? '<br><span style="color: #b7950b; font-weight: bold;">🏆 Empleado del mes</span>' 
                                    : ''}
                            </td>
                        `;

                        cuerpoTabla.appendChild(fila);
                    });
                } else {
                    alert("No se pudo cargar el reporte de desempeño.");
                }
            } catch (error) {
                console.error("Error al obtener el reporte de desempeño:", error);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
