<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div id="cabecera_sesion">
        <h1>Inicio de sesión</h1>
    </div>
    <div id="cuestionario_sesion">
        <label for="input-user" class="label-inputs">Ingresa tu usuario:</label>
        <input type="text" class="campos_datos" placeholder="Ej. usuario123" id="input-user"></input>
        <label for="input-contra" class="label-inputs">Ingresa tu contraseña:</label>
        <input type="password" class="campos_datos" placeholder="Ej. contra123" id="input-contra"></input>

        <button id="boton-login">Iniciar sesión</button>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
