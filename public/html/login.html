<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXXO-Inicio de sesión</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <div class="contenedor-principal">
        <div id="cabecera_sesion">
            <h1>BIENVENIDO<br>INICIO DE SESIÓN</h1>
        </div>
        
        <div id="cuestionario_sesion">
            <label for="input-user" class="label-inputs">Usuario</label>
            <input type="text" class="campos_datos" placeholder="Ingresa tu usuario" id="input-user">
            
            <label for="input-contra" class="label-inputs">Contraseña</label>
            <input type="password" class="campos_datos" placeholder="••••••••••••" id="input-contra">

            <button id="boton-login">Acceder</button>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
