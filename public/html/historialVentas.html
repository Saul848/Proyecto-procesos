<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas</title>
    <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>
    <div class="container">
        <h1>Control Financiero: Historial de Ventas</h1>

        <!-- Formulario de filtros -->
        <div class="card-filtros" style="margin: 20px 0; padding: 20px; background: #f4f4f4; border-radius: 8px;">
            <h3>Filtrar Ventas</h3>
            <form id="formFiltros" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
                <div>
                    <label for="fechaInicio">Fecha Inicio:</label><br>
                    <input type="date" id="fechaInicio" name="fechaInicio">
                </div>
                <div>
                    <label for="fechaFin">Fecha Fin:</label><br>
                    <input type="date" id="fechaFin" name="fechaFin">
                </div>
                <div>
                    <label for="idEmpleado">ID Empleado:</label><br>
                    <input type="text" id="idEmpleado" name="idEmpleado" placeholder="Ej. 1">
                </div>
                <div>
                    <button type="submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Filtrar</button>
                    <button type="button" id="btnLimpiar" style="padding: 8px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpiar</button>
                </div>
            </form>
        </div>

        <div style="margin: 20px 0;">
            <h3>Total de Ventas Encontradas: <span id="totalVentas">0</span></h3>
        </div>

        <table class="tabla-productos" border="1" width="100%" style="border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr>
                    <th>Folio (ID)</th>
                    <th>Fecha</th>
                    <th>ID Empleado</th>
                    <th>Productos / Items</th>
                    <th>Total ($)</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaHistorial">
                <!-- Se llena con JavaScript -->
            </tbody>
        </table>

        <div style="margin-top: 20px;">
            <a href="gerente.html" class="btn-regresar">Regresar al Inicio</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarHistorial();

            document.getElementById("formFiltros").addEventListener("submit", (e) => {
                e.preventDefault();
                cargarHistorial();
            });

            document.getElementById("btnLimpiar").addEventListener("click", () => {
                document.getElementById("fechaInicio").value = "";
                document.getElementById("fechaFin").value = "";
                document.getElementById("idEmpleado").value = "";
                cargarHistorial();
            });
        });

        async function cargarHistorial() {
            try {
                const fechaInicio = document.getElementById("fechaInicio").value;
                const fechaFin = document.getElementById("fechaFin").value;
                const idEmpleado = document.getElementById("idEmpleado").value;

                // Construir parámetros de consulta (Query params)
                const params = new URLSearchParams();
                if (fechaInicio) params.append("fechaInicio", fechaInicio);
                if (fechaFin) params.append("fechaFin", fechaFin);
                if (idEmpleado) params.append("idEmpleado", idEmpleado);

                const respuesta = await fetch(`/api/ventas/historial?${params.toString()}`);
                const datos = await respuesta.json();

                if (datos.ok) {
                    document.getElementById("totalVentas").textContent = datos.data.length;
                    const cuerpoTabla = document.getElementById("cuerpoTablaHistorial");
                    cuerpoTabla.innerHTML = "";

                    if (datos.data.length === 0) {
                        cuerpoTabla.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">No se encontraron ventas con los filtros seleccionados.</td></tr>`;
                        return;
                    }

                    datos.data.forEach(venta => {
                        const fila = document.createElement("tr");

                        // Formatear los items de la venta para mostrarlos bonitos en la celda
                        let itemsHtml = "<ul>";
                        let listaItems = venta.items?.item || [];
                        if (!Array.isArray(listaItems)) listaItems = [listaItems];

                        listaItems.forEach(item => {
                            itemsHtml += `<li>${item.cantidad}x ${item.nombre} ($${item.subtotal})</li>`;
                        });
                        itemsHtml += "</ul>";

                        fila.innerHTML = `
                            <td>${venta['@_id'] || venta.id}</td>
                            <td>${new Date(venta.fecha).toLocaleString()}</td>
                            <td>${venta.idEmpleado}</td>
                            <td>${itemsHtml}</td>
                            <td><strong>$${Number(venta.total).toFixed(2)}</strong></td>
                        `;

                        cuerpoTabla.appendChild(fila);
                    });
                } else {
                    alert("No se pudo cargar el historial.");
                }
            } catch (error) {
                console.error("Error al obtener el historial de ventas:", error);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
