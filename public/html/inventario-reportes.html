<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Inventario</title>
    <link rel="stylesheet" href="../css/reporteEstilo.css"> 
</head>
<body>

    <div class="card-gerente-wide">
        <!-- Título superior en la pestaña blanca -->
        <div class="card-header-title">
            Reporte de Inventario y Existencias
        </div>
        
        <div class="card-body">
            <!-- Caja de resumen para el total -->
            <div class="card-resumen-box">
                <h3>Total de Existencias en Almacén: <span id="totalExistencias">0</span> unidades</h3>
            </div>

            <!-- Tabla de inventario -->
            <div class="tabla-desempeno-wrapper">
                <table class="tabla-desempeno">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado / Alerta</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaReporte">
                        <!-- Los datos se cargan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="btn-regresar-container">
        <a href="gerente.html" class="btn-regresar">← Regresar al Inicio</a>
    </div>

    <!-- meti aqui el script porque me estaba marcando el error 404 de que no encontraba el archivo js y ya me habia desesperado-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarReporteInventario();
        });

        async function cargarReporteInventario() {
            try {
                const respuesta = await fetch("/api/productos/inventario-reportes");
                const datos = await respuesta.json();

                if (datos.ok) {
                    document.getElementById("totalExistencias").textContent = datos.totalExistencias;
                    const cuerpoTabla = document.getElementById("cuerpoTablaReporte");
                    cuerpoTabla.innerHTML = "";

                   datos.productos.forEach(prod => {
                        const fila = document.createElement("tr");

                        // Si hay desabasto, le asignamos la clase de alerta
                        if (prod.esDesabasto) {
                            fila.classList.add("fila-desabasto");
                        }

                        fila.innerHTML = `
                            <td>${prod.id}</td>
                            <td><strong>${prod.nombre}</strong></td>
                            <td>${prod.descripcion}</td>
                            <td>$${prod.precio}</td>
                            <td>${prod.stock}</td>
                            <td>
                                ${prod.esDesabasto 
                                    ? '<span style="color: #ff9999; font-weight: bold;">⚠️ Desabasto / Stock Bajo</span>' 
                                    : '<span style="color: #2ecc71; font-weight: bold;">Normal</span>'}
                            </td>
                        `;

                        cuerpoTablaReporte.appendChild(fila);
                    });
                } else {
                    alert("No se pudo cargar el reporte de inventario.");
                }
            } catch (error) {
                console.error("Error al obtener el reporte:", error);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
