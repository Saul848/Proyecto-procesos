<!-- componentes/modal-producto.html -->

<div id="modal-producto" class="modal">

    <div class="modal-contenido">

        <h2>Nuevo producto</h2>

        <div class="grupo-campos" id="campos-producto">
            <div class="campo" id="campo-nombre">
                <label for="input-nombre-producto">Nombre:</label>
                <input type="text" id="input-nombre-producto" name="nombreProducto" placeholder="Ej. Sardina Calmex">
            </div>
            <div class="campo" id="campo-descripcion">
                <label for="input-descripcion-producto">Descripcion:</label>
                <input type="text" id="input-descripcion-producto" name="descripcionProducto"
                    placeholder="Ej. Cont net. 430g">
            </div>
            <div class="campo" id="campo-categoria">
                <label for="select-categoria-producto">Categoría:</label>
                <select id="select-categoria-producto" name="categoriaProducto">
                </select>
            </div>
            <div class="campo" id="campo-precio">
                <label for="input-precio-producto">Precio:</label>
                <input type="Number" id="input-precio-producto" name="precioProducto">
            </div>
            <div class="campo" id="campo-stock">
                <label for="input-stock-producto">Stock:</label>
                <input type="Number" id="input-stock-producto" name="stockProducto">
            </div>
            <div class="campo" id="campo-descuento">
                <label for="input-descuento-producto">Descuento:</label>
                <input type="Number" id="input-descuento-producto" name="descuentoProducto">
            </div>

        </div>

        <div class="contenedor-botones" id="botones-producto-agregar">
            <button id="boton-salir-agregar">Cerrar</button>
            <button id="boton-agregar-producto">Agregar</button>
        </div>

    </div>

</div>
